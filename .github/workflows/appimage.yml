name: AppImage

on:
  release:
    types: [published]
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-latest

    # The older of the two Ubuntu releases we target, because an AppImage only runs
    # on a glibc at least as new as the one it was built against. Do not reach for
    # an upstream Qt here to get a newer one: the official Qt binaries are built on
    # Ubuntu 24.04 themselves, so they would raise this floor rather than lower it.
    container: ubuntu:24.04

    permissions:
      contents: write

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y git curl file build-essential cmake pkg-config ninja-build \
          qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-wayland qt6-gtk-platformtheme \
          librtmidi-dev librtaudio-dev libsndfile-dev libjack-jackd2-dev \
          qml6-module-qtcore qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick \
          qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
          qml6-module-qtquick-templates qml6-module-qtquick-window

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build AppImage
      run: ./scripts/build-appimage

    # A runner has no sound card, so the application cannot be started here.
    # What can be checked is the bundling itself, which is the part that breaks.
    - name: Verify the bundle
      run: |
        ./Noteahead-*.AppImage --appimage-extract
        missing=$(ldd squashfs-root/usr/bin/noteahead | grep "not found" || true)
        if [ -n "$missing" ]; then echo "Unresolved libraries:"; echo "$missing"; exit 1; fi
        test -f squashfs-root/fallback/libjack.so.0/libjack.so.0
        test -d squashfs-root/usr/qml/QtQuick/Controls/Universal
        test -d squashfs-root/usr/qml/QtQuick/Dialogs
        test -f squashfs-root/usr/plugins/platforms/libqxcb.so
        test -f squashfs-root/usr/plugins/platforms/libqwayland.so
        rm -rf squashfs-root

    - name: Upload as a workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: noteahead-appimage
        path: Noteahead-*.AppImage

    - name: Attach to the release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: Noteahead-*.AppImage
